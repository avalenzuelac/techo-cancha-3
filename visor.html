<style>
  :root { --verde: #1d5e3c; --crema: #f4f1e8; }
  html, body { margin: 0; height: 100%; background: #dfe4e8; color: #1a2b22; font-family: "Liberation Sans", Arial, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 32px); }
  #ui button { background: var(--verde); color: var(--crema); border: 0; border-radius: 6px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
  #ui button:hover { filter: brightness(1.15); }
  #ficha { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); color: #1a2b22; background: rgba(255,255,255,.88); border-left: 4px solid var(--verde); padding: 10px 14px; font-size: 13px; line-height: 1.45; max-width: 300px; }
  body.shot #ui, body.shot #ficha { display: none; }

  #ui button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
  @media (max-width: 520px) { #ficha { font-size: 12px; max-width: calc(100% - 64px); } }
</style>

// Techo cancha 3 - Angol Tennis Club. Modelo a escala desde los planos (docs/*.pdf).
// Convención: unidades en metros, y = arriba, +z = norte (calle Caupolicán), +x = oeste (cancha 2).

// --- Medidas de los planos -------------------------------------------------
const PLANO = {
  ejesX: [-9.9, -4.95, 0, 4.95, 9.9],        // A..E (4,95 entre ejes)
  ejesZ: [19.9, 9.95, 0, -9.95, -19.9],      // 1..5 (9,95 entre ejes), 1 = norte
  alturaAlero: 7.5, alturaCumbrera: 11, vigaInf: 7.0,
  medioLargo: 20, medioAncho: 10, alero: 0.35,
};
const VERDE = 0x1d5e3c, VERDE_CLUB = '#1d5e3c';

function roofY(z) { // cara superior de la cubierta
  const { alturaAlero: a, alturaCumbrera: c, medioLargo: L } = PLANO;
  return c - (c - a) * Math.abs(z) / L;
}

// --- Utilidades --------------------------------------------------------------
function canvasTex(w, h, draw, srgb = true) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// Barras metálicas: se juntan y se dibujan como un InstancedMesh por material.
class Barras {
  constructor() { this.items = []; }
  add(a, b, s = 0.06, mat = 'acero') { this.items.push({ a: a.clone(), b: b.clone(), s, mat }); }
  build(mats) {
    const g = new THREE.BoxGeometry(1, 1, 1), group = new THREE.Group();
    const byMat = {};
    for (const it of this.items) (byMat[it.mat] ||= []).push(it);
    const up = new THREE.Vector3(0, 1, 0), m = new THREE.Matrix4(), q = new THREE.Quaternion();
    for (const [k, list] of Object.entries(byMat)) {
      const im = new THREE.InstancedMesh(g, mats[k], list.length);
      list.forEach((it, i) => {
        const d = it.b.clone().sub(it.a), len = d.length();
        q.setFromUnitVectors(up, d.normalize());
        m.compose(it.a.clone().add(it.b).multiplyScalar(0.5), q, new THREE.Vector3(it.s, len, it.s));
        im.setMatrixAt(i, m);
      });
      im.castShadow = true; im.receiveShadow = true;
      group.add(im);
    }
    return group;
  }
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// Celosía tipo Warren entre una cuerda superior e inferior (funciones de t en [0,1]).
function celosia(B, top, bot, n, sc = 0.09, sw = 0.05) {
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    B.add(top(t0), top(t1), sc); B.add(bot(t0), bot(t1), sc);
    B.add(bot(t0), top(t0), sw);
    B.add(i % 2 ? top(t0) : bot(t0), i % 2 ? bot(t1) : top(t1), sw);
  }
  B.add(bot(1), top(1), sw);
}

// Pilar reticulado de 0,5 x 0,5 m.
function pilar(B, x, z, h) {
  const s = 0.25, c = [[-s, -s], [s, -s], [s, s], [-s, s]];
  for (const [dx, dz] of c) B.add(V(x + dx, 0.15, z + dz), V(x + dx, h, z + dz), 0.08);
  const paso = 0.7, n = Math.floor((h - 0.3) / paso);
  for (let i = 0; i <= n; i++) {
    const y = 0.3 + i * paso, y2 = Math.min(y + paso, h);
    for (let k = 0; k < 4; k++) {
      const [ax, az] = c[k], [bx, bz] = c[(k + 1) % 4];
      B.add(V(x + ax, y, z + az), V(x + bx, y, z + bz), 0.04);
      if (i < n) B.add(V(x + ax, y, z + az), V(x + bx, y2, z + bz), 0.035);
    }
  }
}

// Panel con fondo verde, borde blanco, logo al centro y textos laterales opcionales.
function pintarPanel(ctx, w, h, logo, { logoBox, textos = [], forma } = {}) {
  ctx.fillStyle = VERDE_CLUB; ctx.fillRect(0, 0, w, h);
  if (forma) { ctx.save(); forma(ctx, w, h); ctx.strokeStyle = '#f4f1e8'; ctx.lineWidth = h * 0.03; ctx.stroke(); ctx.restore(); }
  else { ctx.strokeStyle = '#f4f1e8'; ctx.lineWidth = Math.min(w, h) * 0.03; ctx.strokeRect(ctx.lineWidth, ctx.lineWidth, w - 2 * ctx.lineWidth, h - 2 * ctx.lineWidth); }
  if (logo && logoBox) {
    const [cx, cy, bw, bh] = logoBox, r = Math.min(bw / logo.width, bh / logo.height);
    ctx.drawImage(logo, cx - logo.width * r / 2, cy - logo.height * r / 2, logo.width * r, logo.height * r);
  }
  for (const t of textos) {
    ctx.fillStyle = '#f4f1e8'; ctx.font = `bold ${t.size}px "Liberation Sans", Arial, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t.txt, t.x, t.y);
  }
}

// --- Construcción ----------------------------------------------------------------
// omitirFrente: quita el pilar central del eje 1 y su franja (solo para el fotomontaje, la cámara queda a 4 m de ese marco).
async function construir({ logoUrl = 'logo.png', soloTecho = false, omitirFrente = false } = {}) {
  const logo = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = logoUrl; });
  const scene = new THREE.Scene();
  const { ejesX, ejesZ, alturaAlero, vigaInf, medioLargo: L, medioAncho: W, alero } = PLANO;

  const mats = {
    acero: new THREE.MeshStandardMaterial({ color: VERDE, metalness: 0.45, roughness: 0.5 }),
    hormigon: new THREE.MeshStandardMaterial({ color: 0xb8b4ac, roughness: 0.95 }),
    costanera: new THREE.MeshStandardMaterial({ color: 0x9aa3a6, metalness: 0.6, roughness: 0.45 }),
  };

  // Estructura
  const B = new Barras();
  ejesX.forEach((x) => [ejesZ[0], ejesZ[4]].forEach((z) => { if (!(omitirFrente && x === 0 && z === ejesZ[0])) pilar(B, x, z, alturaAlero); }));
  [1, 2, 3].forEach((i) => [ejesX[0], ejesX[4]].forEach((x) => pilar(B, x, ejesZ[i], alturaAlero)));
  // Vigas perimetrales transversales (ejes 1 y 5)
  for (const z of [ejesZ[0], ejesZ[4]])
    celosia(B, (t) => V(-9.9 + 19.8 * t, alturaAlero, z), (t) => V(-9.9 + 19.8 * t, vigaInf, z), 10);
  // Vigas longitudinales: en A y E cercha triangular (cuerda inferior 7,0 y perimetral 7,5); en B, C, D inclinadas
  for (const x of ejesX) {
    const lateral = x === ejesX[0] || x === ejesX[4];
    for (const s of [1, -1]) { // mitad norte y sur
      const z0 = s * ejesZ[0];
      const top = (t) => V(x, roofY(z0 * (1 - t)) - 0.12, z0 * (1 - t));
      const bot = lateral ? (t) => V(x, vigaInf, z0 * (1 - t))
                          : (t) => V(x, roofY(z0 * (1 - t)) - 0.12 - (0.5 + 0.4 * t), z0 * (1 - t));
      celosia(B, top, bot, lateral ? 10 : 12);
      if (lateral) B.add(V(x, alturaAlero, z0), V(x, alturaAlero, 0), 0.08);
    }
  }
  // Cercha de cumbrera (eje 3)
  celosia(B, (t) => V(-9.9 + 19.8 * t, roofY(0) - 0.12, 0), (t) => V(-9.9 + 19.8 * t, roofY(0) - 0.85, 0), 10);
  // Costaneras
  for (let z = 1.2; z < L; z += 1.5) for (const s of [1, -1])
    B.add(V(-W - alero + 0.1, roofY(z) - 0.1, s * z), V(W + alero - 0.1, roofY(z) - 0.1, s * z), 0.09, 'costanera');
  scene.add(B.build(mats));

  // Fundaciones (dado de hormigón 0,8 x 0,8)
  const fund = new THREE.BoxGeometry(0.8, 0.3, 0.8);
  ejesX.forEach((x) => ejesZ.forEach((z, i) => {
    if ((i === 0 || i === 4) || x === ejesX[0] || x === ejesX[4]) {
      const m = new THREE.Mesh(fund, mats.hormigon); m.position.set(x, 0.0, z); m.receiveShadow = m.castShadow = true; scene.add(m);
    }
  }));

  // Cubierta: plancha ondulada trapezoidal, dos aguas
  const cubiertaMat = new THREE.MeshStandardMaterial({ color: 0xc9ced1, metalness: 0.55, roughness: 0.38 });
  const cubiertaInf = new THREE.MeshStandardMaterial({ color: 0x9da3a6, metalness: 0.15, roughness: 0.7, side: THREE.BackSide, envMapIntensity: 0.4 });
  const paso = 0.25, ancho = 2 * (W + alero), nOnd = Math.round(ancho / paso);
  for (const s of [1, -1]) {
    const pos = [], idx = [], perfil = [0, 0.3, 0.55, 0.8], alto = [0, 0.035, 0.035, 0];
    const zEave = s * (L + alero);
    const cols = [];
    for (let k = 0; k < nOnd; k++) for (let j = 0; j < 4; j++) cols.push([-ancho / 2 + (k + perfil[j]) * paso, alto[j]]);
    cols.push([ancho / 2, 0]);
    for (const [x, dy] of cols) {
      pos.push(x, roofY(0) + dy, 0);
      pos.push(x, roofY(L) - (roofY(0) - roofY(L)) * alero / L + dy, zEave);
    }
    for (let i = 0; i < cols.length - 1; i++) { const a = 2 * i; if (s > 0) idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); else idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, cubiertaMat); m.castShadow = m.receiveShadow = true; scene.add(m);
    const mi = new THREE.Mesh(g, cubiertaInf); mi.receiveShadow = true; scene.add(mi);
  }
  // Cumbrera (caballete)
  const cab = new THREE.Mesh(new THREE.BoxGeometry(ancho, 0.08, 0.6), cubiertaMat); cab.position.set(0, roofY(0) + 0.06, 0); scene.add(cab);

  // --- Publicidad --------------------------------------------------------------
  const pubs = new THREE.Group(); scene.add(pubs);
  // 1) Logo pintado sobre cada agua de la cubierta (14 x 8 m), legible desde el lado de su alero.
  const texTecho = canvasTex(2048, 1170, (c, w, h) => pintarPanel(c, w, h, logo, { logoBox: [w / 2, h / 2, w * 0.82, h * 0.78] }));
  for (const s of [1, -1]) {
    const zc = s * 9.6, largo = 8, anchoP = 14;
    const ang = Math.atan2(roofY(0) - roofY(L), L);
    const g = new THREE.PlaneGeometry(anchoP, largo / Math.cos(ang) * Math.cos(ang));
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: texTecho, metalness: 0.2, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -4 }));
    // plano horizontal -> rotar a la pendiente; arriba del texto hacia la cumbrera
    m.rotation.order = 'YXZ';
    m.rotation.y = s > 0 ? 0 : Math.PI;
    m.rotation.x = -Math.PI / 2 + ang;
    m.position.set(0, roofY(zc) + 0.05, zc);
    m.receiveShadow = true; pubs.add(m);
  }
  // 2) Paneles en los triángulos laterales (ejes A y E): 40 m de base, de 7,0 m a la cumbrera.
  const hT = roofY(0) - vigaInf; // 4 m
  const texTri = (lado) => canvasTex(4096, Math.round(4096 * (hT + 0.1) / (2 * L)), (c, w, h) => {
    const sx = w / (2 * L), sy = h / (hT + 0.1);
    const forma = (ctx) => { ctx.beginPath(); ctx.moveTo(4, h - 4); ctx.lineTo(4, h - 0.5 * sy); ctx.lineTo(w / 2, 6); ctx.lineTo(w - 4, h - 0.5 * sy); ctx.lineTo(w - 4, h - 4); ctx.closePath(); };
    pintarPanel(c, w, h, logo, {
      forma, logoBox: [w / 2, h * 0.58, 9 * sx, 2.5 * sy],
      textos: [{ txt: 'ANGOL TENNIS CLUB', x: w * 0.22, y: h * 0.8, size: 0.62 * sy }, { txt: 'ANGOL TENNIS CLUB', x: w * 0.78, y: h * 0.8, size: 0.62 * sy }],
    });
  });
  const triGeom = (x, signoU) => {
    const pts = [[-L, vigaInf], [L, vigaInf], [L, alturaAlero], [0, roofY(0)], [-L, alturaAlero]];
    const pos = [], uv = [];
    for (const [z, y] of pts) { pos.push(x, y - 0.0, z); uv.push(signoU > 0 ? (z + L) / (2 * L) : (L - z) / (2 * L), (y - vigaInf) / (hT + 0.1)); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex([0, 1, 2, 0, 2, 3, 0, 3, 4]); g.computeVertexNormals(); return g;
  };
  for (const [x, su, lado] of [[W + 0.3, -1, 'o'], [-W - 0.3, 1, 'e']]) {
    const g = triGeom(x, su);
    // normal hacia afuera: +x en el oeste, -x en el este
    const n = g.attributes.normal.getX(0);
    if (Math.sign(n) !== Math.sign(x)) g.setIndex([0, 2, 1, 0, 3, 2, 0, 4, 3]);
    g.computeVertexNormals();
    const fr = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: texTri(lado), roughness: 0.75, side: THREE.FrontSide }));
    const bk = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x24563c, roughness: 0.8, side: THREE.BackSide }));
    fr.castShadow = true; fr.receiveShadow = bk.receiveShadow = true; pubs.add(fr, bk);
  }
  // 3) Franja frontal sobre la viga en ejes 1 (norte, calle) y 5 (sur): 20,6 x 1,0 m
  const texFranja = canvasTex(4096, 200, (c, w, h) => {
    const sx = w / 20.6;
    pintarPanel(c, w, h, logo, { logoBox: [w / 2, h / 2, 3.2 * sx, h * 0.86],
      textos: [{ txt: 'ANGOL TENNIS CLUB · CUBIERTA CANCHA 3', x: w * 0.22, y: h / 2, size: h * 0.42 }, { txt: 'ANGOL TENNIS CLUB · CUBIERTA CANCHA 3', x: w * 0.78, y: h / 2, size: h * 0.42 }] });
  });
  for (const s of omitirFrente ? [-1] : [1, -1]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(20.6, 1.0), new THREE.MeshStandardMaterial({ map: texFranja, roughness: 0.7 }));
    m.position.set(0, 7.15, s * (ejesZ[0] + 0.32)); m.rotation.y = s > 0 ? 0 : Math.PI; m.castShadow = true; pubs.add(m);
    const bk = new THREE.Mesh(new THREE.PlaneGeometry(20.6, 1.0), new THREE.MeshStandardMaterial({ color: 0x24563c, side: THREE.BackSide }));
    bk.position.copy(m.position); bk.rotation.copy(m.rotation); pubs.add(bk);
  }

  // Penumbra bajo la cubierta (luz de cielo nublado tapada): mancha difusa sobre el suelo
  const sombraTecho = canvasTex(256, 512, (c, w, h) => {
    c.clearRect(0, 0, w, h); c.filter = 'blur(18px)'; c.fillStyle = '#fff'; c.fillRect(34, 34, w - 68, h - 68);
  }, false);
  const ao = new THREE.Mesh(new THREE.PlaneGeometry(2 * W + 6, 2 * L + 6), new THREE.MeshBasicMaterial({ alphaMap: sombraTecho, transparent: true, opacity: 0.28, depthWrite: false, color: 0x000000 }));
  ao.rotation.x = -Math.PI / 2; ao.position.y = 0.012; ao.renderOrder = 1; scene.add(ao);

  if (soloTecho) return { scene, pubs };

  entorno(scene, mats);
  return { scene, pubs };
}

// --- Entorno -----------------------------------------------------------------------
function cancha(scene, x0, conRed = true) {
  const g = new THREE.Group(), blanco = new THREE.MeshStandardMaterial({ color: 0xf2efe6, roughness: 0.8 });
  const D = 5.485, S = 4.115, Bl = 11.885, Sv = 6.4, a = 0.05;
  const linea = (x1, z1, x2, z2) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2 - x1) + a, 0.006, Math.abs(z2 - z1) + a), blanco);
    m.position.set(x0 + (x1 + x2) / 2, 0.003, (z1 + z2) / 2); m.receiveShadow = true; g.add(m);
  };
  for (const x of [-D, D, -S, S]) linea(x, -Bl, x, Bl);
  for (const z of [-Bl, Bl]) linea(-D, z, D, z);
  for (const z of [-Sv, Sv]) linea(-S, z, S, z);
  linea(0, -Sv, 0, Sv); linea(0, Bl - 0.15, 0, Bl); linea(0, -Bl, 0, -Bl + 0.15);
  if (conRed) {
    const tex = canvasTex(1024, 96, (c, w, h) => {
      c.clearRect(0, 0, w, h); c.strokeStyle = 'rgba(25,25,25,0.85)'; c.lineWidth = 1.5;
      for (let i = 0; i < w; i += 6) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke(); }
      for (let j = 0; j < h; j += 6) { c.beginPath(); c.moveTo(0, j); c.lineTo(w, j); c.stroke(); }
      c.fillStyle = '#f1f1ea'; c.fillRect(0, 0, w, 8);
    });
    const P = 6.4, pos = [], uv = [], n = 20;
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = -P + 2 * P * t, h = 0.914 + (1.07 - 0.914) * Math.pow(Math.abs(2 * t - 1), 1.6);
      pos.push(x0 + x, h, 0, x0 + x, 0.02, 0); uv.push(t, 1, t, 0);
    }
    const idx = []; for (let i = 0; i < n; i++) { const k = 2 * i; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    gg.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); gg.setIndex(idx); gg.computeVertexNormals();
    const red = new THREE.Mesh(gg, new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.2, side: THREE.DoubleSide, roughness: 0.9 }));
    red.castShadow = true; g.add(red);
    for (const x of [-P, P]) {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.07, 10), new THREE.MeshStandardMaterial({ color: 0x2e5a45 }));
      p.position.set(x0 + x, 0.535, 0); p.castShadow = true; g.add(p);
    }
  }
  scene.add(g);
}

function arbol(scene, B, r, x, z, tipo, matHoja) {
  if (tipo === 'cipres') {
    const h = 9 + r() * 7, g = new THREE.Group(), n = 9;
    for (let k = 0; k < n; k++) {
      const t = k / (n - 1), rad = (2.4 + r() * 0.5) * (1 - 0.75 * t) + 0.3;
      const geo = new THREE.IcosahedronGeometry(1, 2), p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) { const f = 0.8 + r() * 0.35; p.setXYZ(i, p.getX(i) * f, p.getY(i) * f, p.getZ(i) * f); }
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, matHoja[k % matHoja.length]);
      m.scale.set(rad, rad * 1.5, rad); m.position.set(x + (r() - 0.5) * 0.8, 1.6 + t * (h - 2.5), z + (r() - 0.5) * 0.8);
      m.castShadow = m.receiveShadow = true; g.add(m);
    }
    B.add(V(x, 0, z), V(x, 2, z), 0.4, 'tronco');
    scene.add(g);
  } else { // álamo sin hojas (invierno): tronco y ramas finas hacia arriba
    const h = 16 + r() * 8;
    B.add(V(x, 0, z), V(x, h, z), 0.45, 'tronco');
    for (let k = 0; k < 26; k++) {
      const y = 2.5 + r() * (h - 4), ang = r() * 6.28, len = 1.5 + r() * 2.5 * (1 - y / h + 0.3);
      B.add(V(x, y, z), V(x + Math.cos(ang) * len * 0.45, y + len, z + Math.sin(ang) * len * 0.45), 0.09, 'tronco');
    }
  }
}

function entorno(scene, mats) {
  // Suelo de arcilla con textura
  const arcilla = canvasTex(1024, 1024, (c, w, h) => {
    c.fillStyle = '#a5533a'; c.fillRect(0, 0, w, h); const r = rand(7);
    for (let i = 0; i < 26000; i++) { const v = r(); c.fillStyle = `rgba(${v > .5 ? 210 : 120},${v > .5 ? 110 : 55},${v > .5 ? 80 : 35},0.12)`; c.fillRect(r() * w, r() * h, 2 + r() * 4, 2 + r() * 4); }
  });

  const pastoBase = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ color: 0x5f7a45, roughness: 1 }));

  pasto.rotation.x = -Math.PI / 2; pasto.position.y = -0.02; scene.add(pasto);

  // cancha 3 (la techada, extremo este), cancha 2 y cancha 1 hacia el oeste
  cancha(scene, 0); cancha(scene, 20.5); cancha(scene, 38.7);

  // Talud norte y calle Caupolicán (en altura)
  const taludMat = new THREE.MeshStandardMaterial({ color: 0x55703a, roughness: 1 });

  vereda.rotation.x = -Math.PI / 2; vereda.position.set(0, 4.74, 28); scene.add(vereda);

  const B = new Barras(), r = rand(42);
  // Baranda verde al borde del talud
  for (let x = -60; x <= 60; x += 2.5) B.add(V(x, 4.7, 24.4), V(x, 5.7, 24.4), 0.07);
  B.add(V(-60, 5.7, 24.4), V(60, 5.7, 24.4), 0.07);
  // Cerco perimetral y entre canchas (malla verde translúcida)

  malla.wrapS = malla.wrapT = THREE.RepeatWrapping;
  const cerco = (x1, z1, x2, z2, h = 3) => {

    const m = new THREE.Mesh(new THREE.PlaneGeometry(len, h), new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide }));
    m.position.set((x1 + x2) / 2, h / 2, (z1 + z2) / 2); m.rotation.y = -Math.atan2(z2 - z1, x2 - x1); scene.add(m);
    for (let k = 0; k <= Math.ceil(len / 3); k++) { const t2 = k / Math.ceil(len / 3); B.add(V(x1 + (x2 - x1) * t2, 0, z1 + (z2 - z1) * t2), V(x1 + (x2 - x1) * t2, h, z1 + (z2 - z1) * t2), 0.06); }

  cerco(-11, -20.5, 16, -20.5);                          // cerco alto al sur de la cancha 3

  galpon.position.set(37, 2.6, -25.9); galpon.castShadow = galpon.receiveShadow = true; scene.add(galpon);
  const letrero = canvasTex(4096, 256, (c, w, h) => {
    c.fillStyle = '#2c6b4c'; c.fillRect(0, 0, w, h); c.fillStyle = '#f4f1e8'; c.font = 'bold 150px "Liberation Sans", Arial, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('ANGOL        TENNIS        CLUB', w / 2, h / 2);
    c.beginPath(); c.arc(w * 0.12, h / 2, 100, 0, 7); c.strokeStyle = '#f4f1e8'; c.lineWidth = 10; c.stroke(); c.font = 'bold 60px "Liberation Sans"'; c.fillText('100 AÑOS', w * 0.12, h / 2);
    c.beginPath(); c.arc(w * 0.88, h / 2, 100, 0, 7); c.stroke(); c.fillText('100 AÑOS', w * 0.88, h / 2);
  });
  const let1 = new THREE.Mesh(new THREE.PlaneGeometry(42, 3), new THREE.MeshStandardMaterial({ map: letrero, roughness: 0.8 }));
  let1.position.set(37, 2.3, -21.62); scene.add(let1);
  const cub = new THREE.Mesh(new THREE.BoxGeometry(42.6, 0.3, 9.6), new THREE.MeshStandardMaterial({ color: 0x8a5038, roughness: 0.9 }));
  cub.position.set(37, 5.0, -25.9); cub.rotation.x = 0.25; cub.castShadow = true; scene.add(cub);

  // Árboles: cipreses al este y sur, álamos detrás
  const hoja = [0x2c4a28, 0x355a2e, 0x27432a].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, flatShading: true }));
  // fila de cipreses al este de la cancha 3, despejada hasta x=-11,3 para que quepa la estructura
  for (let z = -24; z < 21; z += 3.2 + r()) arbol(scene, B, r, -11.4 - r() * 1.8, z, 'cipres', hoja);
  for (let i = 0; i < 10; i++) arbol(scene, B, r, -15 - r() * 4, -28 + r() * 46, 'cipres', hoja);
  for (let i = 0; i < 9; i++) arbol(scene, B, r, -16 - r() * 8, -30 + r() * 46, 'alamo');
  for (let i = 0; i < 5; i++) arbol(scene, B, r, -8 + r() * 20, -27 - r() * 7, 'alamo');
  for (const [x, z] of [[-6, -27], [4, -29], [11, -26]]) arbol(scene, B, r, x, z, 'cipres', hoja);
  // Casas sobre la calle
  for (let i = 0; i < 9; i++) {
    const h = 5 + r() * 3, m = new THREE.Mesh(new THREE.BoxGeometry(9 + r() * 4, h, 8), new THREE.MeshStandardMaterial({ color: [0xd8d2c4, 0xc96d5a, 0xe6dfcf, 0xb9b4a8][i % 4], roughness: 0.9 }));
    m.position.set(-50 + i * 13, 4.7 + h / 2, 41); m.castShadow = m.receiveShadow = true; scene.add(m);
  }

  const anillo = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0x3d5434, roughness: 1 }), 320);
  const mm = new THREE.Matrix4();
  for (let i = 0; i < 320; i++) {
    const a = r() * Math.PI * 2, d = 95 + r() * 60, s2 = 3 + r() * 4;
    mm.compose(V(Math.cos(a) * d, s2 * 0.9, Math.sin(a) * d), new THREE.Quaternion(), V(s2, s2 * (1.2 + r()), s2)); anillo.setMatrixAt(i, mm);
  }
  scene.add(anillo);
  scene.add(B.build({ ...mats, tronco: new THREE.MeshStandardMaterial({ color: 0x6b6258, roughness: 1 }) }));
}

// --- Cámaras predefinidas ------------------------------------------------------------
const VISTAS = {
  aerea:          { pos: [30, 27, 37], target: [-1, 2, -3], fov: 42, nombre: 'Aérea' },
  desde_calle:    { pos: [-6.5, 6.4, 27.8], target: [0.5, 6, -4], fov: 56, nombre: 'Desde calle Caupolicán' },
  nivel_cancha:   { pos: [3, 1.6, 11.5], target: [-1.5, 5.4, -10], fov: 62, nombre: 'Nivel de cancha' },
  lateral_cancha2:{ pos: [21, 1.7, -2.5], target: [0, 6.3, 0], fov: 60, nombre: 'Desde cancha 2' },
};

// --- Renderer, luces y cielo ---------------------------------------------------------
function preparar(renderer, scene, { transparente = false } = {}) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;
  scene.add(new THREE.HemisphereLight(0xe3e8ee, 0x7a4a35, 0.8));
  const sol = new THREE.DirectionalLight(0xfff4e6, 2.3);
  sol.position.set(-25, 60, 38); sol.castShadow = true;
  Object.assign(sol.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 200 });
  sol.shadow.mapSize.set(4096, 4096); sol.shadow.bias = -0.0004; sol.shadow.normalBias = 0.03; sol.shadow.radius = 4;
  scene.add(sol);
  if (!transparente) {
    const cielo = canvasTex(2048, 1024, (c, w, h) => {
      const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#a9b6c3'); g.addColorStop(0.4, '#cfd5da'); g.addColorStop(0.5, '#e4e6e7'); g.addColorStop(1, '#e4e6e7');
      c.fillStyle = g; c.fillRect(0, 0, w, h); const r = rand(3);
      // nubes de día nublado, repetidas a ambos lados para que no haya costura en la esfera
      for (let i = 0; i < 700; i++) {
        const x = r() * w, y = h * (0.05 + r() * 0.43), rr = (25 + r() * 80) * (0.5 + (y / h) * 1.4), gris = r() < 0.45 ? 150 + Math.floor(r() * 40) : 225 + Math.floor(r() * 30);
        for (const dx of [-w, 0, w]) {
          const gr = c.createRadialGradient(x + dx, y, 0, x + dx, y, rr);
          gr.addColorStop(0, `rgba(${gris},${gris + 2},${gris + 6},0.42)`); gr.addColorStop(1, `rgba(${gris},${gris + 2},${gris + 6},0)`);
          c.fillStyle = gr; c.fillRect(x + dx - rr, y - rr * 0.6, rr * 2, rr * 1.2);
        }
      }
    });
    const esfera = new THREE.Mesh(new THREE.SphereGeometry(450, 48, 24), new THREE.MeshBasicMaterial({ map: cielo, side: THREE.BackSide, fog: false }));
    scene.add(esfera); scene.background = new THREE.Color(0xdfe4e8);
    scene.fog = new THREE.Fog(0xdfe4e8, 90, 320);
  }
}



const q = new URLSearchParams(location.search);
const shot = null, foto = false;
const W = +(q.get('w') || (shot ? 1920 : innerWidth)), H = +(q.get('h') || (shot ? 1080 : innerHeight));
if (shot || foto) document.body.classList.add('shot');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: foto, preserveDrawingBuffer: true });
renderer.setPixelRatio(shot || foto ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

const { scene } = await construir({ logoUrl: LOGO, soloTecho: foto, omitirFrente: q.has('libre') });
preparar(renderer, scene, { transparente: foto });
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 1000);

if (foto) {
  // Cámara de la foto resuelta con solvePnP (pnp.py): mismo sistema de ejes que la escena.
  const c = await (await fetch('camara_foto.json')).json();
  const R = c.R, Rt = (v) => new THREE.Vector3(R[0][0]*v[0]+R[1][0]*v[1]+R[2][0]*v[2], R[0][1]*v[0]+R[1][1]*v[1]+R[2][1]*v[2], R[0][2]*v[0]+R[1][2]*v[1]+R[2][2]*v[2]);
  camera.fov = c.fovV; camera.aspect = W / H; camera.updateProjectionMatrix();
  camera.position.fromArray(c.C);
  camera.up.copy(Rt([0, -1, 0]));
  camera.lookAt(camera.position.clone().add(Rt([0, 0, 1])));
  // La foto es de día nublado: sin sombras duras, solo la penumbra difusa bajo la cubierta; algo menos de exposición.
  renderer.shadowMap.enabled = false; renderer.toneMappingExposure = 0.82;
}

const controls = foto ? { update() {}, target: new THREE.Vector3() } : new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495;
function irA(k) {
  const v = VISTAS[k]; camera.fov = v.fov; camera.updateProjectionMatrix();
  camera.position.fromArray(v.pos); controls.target.fromArray(v.target); controls.update();
}
const ui = document.getElementById('ui');
for (const [k, v] of Object.entries(VISTAS)) {
  const b = document.createElement('button'); b.textContent = v.nombre; b.onclick = () => irA(k); ui.appendChild(b);
}
if (!foto) irA(shot && VISTAS[shot] ? shot : 'aerea');

addEventListener('resize', () => {
  if (shot || foto) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
if (shot || foto) {
  renderer.render(scene, camera); renderer.render(scene, camera);
  window.__listo = renderer.domElement.toDataURL('image/png');
} else {
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
}
